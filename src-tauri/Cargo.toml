[package]
name = "mhtalk"
version = "1.0.0"
description = "MHTalk desktop client"
edition = "2021"

[lib]
name = "mhtalk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
