services:
  relay:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: .env
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 80
    volumes:
      - ./data:/data
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: '2'
