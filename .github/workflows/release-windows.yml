name: Publish signed Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Install Worker dependencies
        run: npm --prefix worker ci
      - name: Install Patreon relay test dependencies
        run: npm --prefix patreon-relay ci
      - name: Run release quality gates
        run: npm run check
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_LIVEKIT_URL: wss://mhtalkremake-utuei6i7.livekit.cloud
          VITE_LIVEKIT_TOKEN_ENDPOINT: https://mhtalk-token-service.mhlkotalk.workers.dev/livekit/token
          VITE_SOCIAL_API_ENDPOINT: https://mhtalk-token-service.mhlkotalk.workers.dev
        with:
          tagName: v__VERSION__
          releaseName: MHTalk __VERSION__
          releaseBody: |
            Membership now starts with a choice of LAVA or Patreon, followed by the available tiers.

            Signed-in MHTalk users can open Patreon sign-in and checkout in a private app window without Canary invitation codes. Existing paid and gifted memberships can be linked without a new payment. Connection errors are now distinguished from an ineligible membership.

            After subscribing, close the Patreon window and choose Link Patreon membership. Patreon confirms the final tier and price. Use Patreon email sign-in if a social sign-in provider rejects the embedded window.

            LAVA, calling, recording and automatic updates retain their existing behavior. Automated checks cover authorization, connection transport and callbacks; a live bank payment and bank-specific 3-D Secure flow were not exercised for this release.
          releaseDraft: true
          args: --bundles nsis
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
