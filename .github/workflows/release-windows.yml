name: Publish signed Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Install Worker dependencies
        run: npm --prefix worker ci
      - name: Run release quality gates
        run: npm run check
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_LIVEKIT_URL: wss://mhtalkremake-utuei6i7.livekit.cloud
          VITE_LIVEKIT_TOKEN_ENDPOINT: https://mhtalk-token-service.mhlkotalk.workers.dev/livekit/token
          VITE_SOCIAL_API_ENDPOINT: https://mhtalk-token-service.mhlkotalk.workers.dev
        with:
          tagName: v__VERSION__
          releaseName: MHTalk __VERSION__
          releaseBody: Signed MHTalk Windows release with automatic updater metadata.
          args: --bundles nsis
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
