name: Publish signed Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Install Worker dependencies
        run: npm --prefix worker ci
      - name: Install Patreon relay test dependencies
        run: npm --prefix patreon-relay ci
      - name: Run release quality gates
        run: npm run check
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_LIVEKIT_URL: wss://mhtalkremake-utuei6i7.livekit.cloud
          VITE_LIVEKIT_TOKEN_ENDPOINT: https://mhtalk-token-service.mhlkotalk.workers.dev/livekit/token
          VITE_SOCIAL_API_ENDPOINT: https://mhtalk-token-service.mhlkotalk.workers.dev
        with:
          tagName: v__VERSION__
          releaseName: MHTalk __VERSION__
          releaseBody: |
            Room connections now use expanded server capacity with coordinated switching that keeps room members together.

            The connection panel displays Server 1, Server 2, and so on, with the remaining allocation for the server actually carrying the call. Connection messages use simple server names.

            Includes improved connection recovery diagnostics and the updated 90% switching threshold. Tested room allocation, switching, and real two-peer audio and data connections.
          releaseDraft: true
          args: --bundles nsis
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
